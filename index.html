<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Monitor sun shield</title>
<style>
  html, body { margin: 0; height: 100%; background: #eef0f3; font: 14px/1.4 -apple-system, system-ui, sans-serif; color: #222; }
  #bar { position: fixed; top: 12px; left: 12px; display: flex; gap: 6px; flex-wrap: wrap; z-index: 2; }
  button { border: 1px solid #c4c8ce; background: #fff; border-radius: 16px; padding: 6px 12px; cursor: pointer; }
  button.on { background: #232f3e; color: #fff; border-color: #232f3e; }
  #note { position: fixed; bottom: 12px; left: 12px; color: #555; z-index: 2; }
  canvas { display: block; }
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
               "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/" } }
</script>
</head>
<body>
<div id="bar">
  <button data-view="front">Front</button>
  <button data-view="back">Back (sun side)</button>
  <button data-view="spine">Spine</button>
  <button data-view="seam">Seam close-up</button>
  <button data-view="seamBack">Seam from behind</button>
  <button data-view="exploded">Exploded</button>
  <button data-view="plateA">Plate A</button>
  <button data-view="plateB">Plate B</button>
  <button data-view="plateC">Plate C</button>
  <button data-view="plateD">Plate D</button>
  <button data-view="plateT">Test plate</button>
  <button id="monitors" class="on">Monitors</button>
</div>
<div id="note">Drag to orbit, scroll to zoom, right-drag to pan. Units are mm.</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeef0f3);
const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 5, 20000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f99, 1.4));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(-600, 900, 1400); scene.add(sun);
const rim = new THREE.DirectionalLight(0xffffff, 0.8); rim.position.set(900, 300, -1200); scene.add(rim);

// our frame: x across, y depth (+ back), z up  ->  three: (x, z, -y)
const T = (x, y, z) => new THREE.Vector3(x, z, -y);
const views = {
  front:    [T(250, -1900, 520),  T(0, 120, -40)],
  back:     [T(-500, 1700, 700),  T(0, 0, -20)],
  spine:    [T(-140, -420, 260),  T(0, 30, 110)],
  seam:     [T(-240, -420, 150),  T(-190, 20, 100)],
  seamBack: [T(-260, 520, 160),   T(-190, 20, 100)],
  corner:   [T(-1010, -620, 330), T(-770, -200, 150)],
  cornerBack: [T(-1050, 250, 330), T(-770, -200, 150)],
  cam:      [T(-180, -420, 200),  T(0, -5, 20)],
  camTop:   [T(-60, -260, 420),   T(0, -5, 10)],
  camUnder: [T(-150, -330, -150), T(-30, -20, 0)],
  sideBack: [T(-1500, 900, 150), T(-560, 100, -120)],
};
views.exploded = [T(0, -3300, 1100), T(0, 60, 40)];
// print plates (plates.glb): plate i spans x = i*400 .. i*400+256 on a 256 mm bed
const plateView = (i, z) => [T(i * 400 + 128 - 170, -260, z + 230), T(i * 400 + 128, 128, z * 0.35)];
views.plateA = plateView(0, 235);
views.plateB = plateView(1, 220);
views.plateC = plateView(2, 205);
views.plateD = plateView(3, 205);
views.plateT = [T(4 * 400 + 128 - 70, -40, 150), T(4 * 400 + 128, 128, 10)];
const plateNotes = {
  plateA: 'Plate A: both outer and both middle pieces, standing as the files open. 256 x 256 mm bed.',
  plateB: 'Plate B: both inner pieces standing on their seam end, and the webcam shelf flat on its bottom. 256 x 256 mm bed.',
  plateC: 'Plate C: left side extension, one piece, diagonal, standing on its flat outer edge. 256 x 256 mm bed.',
  plateD: 'Plate D: right side extension, one piece, diagonal, standing on its flat outer edge. 256 x 256 mm bed.',
  plateT: 'Test plate: the fixed seam piece and the three fit pieces, standing like the real parts. 256 x 256 mm bed.',
};
let monitorsOn = true, assemblyRoot = null, platesRoot = null;
const noteEl = document.getElementById('note'), noteDefault = noteEl.textContent;
function go(v) {
  const [eye, tgt] = views[v];
  camera.position.copy(eye); controls.target.copy(tgt); controls.update();
  document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  const plate = v in plateNotes;
  if (assemblyRoot) assemblyRoot.visible = !plate;
  if (platesRoot) platesRoot.visible = plate;
  noteEl.textContent = plate ? plateNotes[v] : noteDefault;
  setExploded(v === 'exploded');
}
new GLTFLoader().load('plates.glb?v=' + Date.now(), gltf => {
  gltf.scene.traverse(o => {
    if (!o.isMesh) return;
    o.material = new THREE.MeshStandardMaterial({
      color: 0xffffff, vertexColors: !!o.geometry.attributes.color,
      flatShading: true, roughness: o.name.startsWith('bed_') ? 0.9 : 0.75, metalness: 0.05,
    });
  });
  platesRoot = gltf.scene;
  const cur = document.querySelector('[data-view].on');
  platesRoot.visible = !!cur && cur.dataset.view in plateNotes;
  scene.add(platesRoot);
});
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => go(b.dataset.view));

const toe = 14 * Math.PI / 180;   // measured 152 deg between the monitors
const dirL = new THREE.Vector3(Math.cos(toe), 0, -Math.sin(toe));
const dirR = new THREE.Vector3(Math.cos(toe), 0, Math.sin(toe));
const order = ['extension', 'outer', 'middle-camera', 'inner'];
const shield = [], monitors = [];
let exploded = false;

new GLTFLoader().load('assembly.glb?v=' + Date.now(), gltf => {
  gltf.scene.traverse(o => {
    if (!o.isMesh) return;
    const src = o.material.color ? o.material.color.clone() : new THREE.Color(0x5c6674);
    const isShield = o.name.startsWith('shield_');
    o.material = new THREE.MeshStandardMaterial({
      color: o.geometry.attributes.color ? 0xffffff : src,
      vertexColors: !!o.geometry.attributes.color,
      flatShading: true, roughness: isShield ? 0.75 : 0.5, metalness: 0.05,
    });
    const m = o.name.match(/^shield_(left|right)_(.+)$/);
    if (m) {
      const shelf = m[2] === 'webcam-shelf';
      const k = order.indexOf(shelf ? 'inner' : m[2]);
      // each piece slides away from the spine along its own panel: GAP between pieces,
      // SPLIT between the two monitors' halves; alternate pieces lift so the joints read
      const GAP = 110, SPLIT = 90, d = (3 - k) * GAP + SPLIT;
      const off = (m[1] === 'left' ? dirL.clone().multiplyScalar(-d) : dirR.clone().multiplyScalar(d));
      off.y += (k % 2) * 40;
      if (shelf) off.add(T(0, -90, 30));   // the shelf slides forward off its rail
      shield.push({ o, base: o.position.clone(), off });
    } else monitors.push(o);
  });
  assemblyRoot = gltf.scene;
  scene.add(gltf.scene);
  const q = new URLSearchParams(location.search);
  go(q.get('view') || 'front');
  if (q.get('nomon')) document.getElementById('monitors').click();
  if (q.get('shot')) document.querySelectorAll('#bar,#note').forEach(e => e.style.display = 'none');
});

let anim = null;
function setExploded(on) {
  if (on === exploded) return;
  exploded = on;
  // monitors and webcam would hide the gaps, so the exploded tab hides them
  monitors.forEach(o => o.visible = on ? false : monitorsOn);
  const from = shield.map(s => s.o.position.clone());
  const to = shield.map(s => s.base.clone().add(on ? s.off : new THREE.Vector3()));
  const t0 = performance.now();
  anim = () => {
    const k = Math.min(1, (performance.now() - t0) / 600), e = k * k * (3 - 2 * k);
    shield.forEach((s, i) => s.o.position.lerpVectors(from[i], to[i], e));
    if (k === 1) anim = null;
  };
}
document.getElementById('monitors').onclick = e => {
  monitorsOn = e.target.classList.toggle('on');
  if (!exploded) monitors.forEach(o => o.visible = monitorsOn);
};
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(() => { if (anim) anim(); controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
